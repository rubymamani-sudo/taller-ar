<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Taller AR - Tarjetas Geométricas</title>
  
  <!-- Librerías: A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      z-index: 999;
      color: white;
      text-shadow: 1px 1px 3px black;
    }
    #ui p { margin: 4px 0; font-size: 15px; }
    .botones-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
    }
    button {
      padding: 12px 20px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #btn-tamano { background: #007bff; color: white; }
    #btn-holograma { background: #8a2be2; color: white; }
  </style>
</head>
<body>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false;">

    <!-- Tarjeta A: marcador Hiro → Cubo -->
    <a-marker preset="hiro" id="marcadorA">
      <a-box color="blue" position="0 0.5 0" scale="1 1 1" class="figura3d" id="objetoA" 
             material="opacity: 1; transparent: true; wireframe: false; emissive: #000000;">
        <!-- Partículas alrededor del cubo (ocultas al inicio) -->
        <a-entity id="particulasA" visible="false" particle-system="preset: dust; color: #00ffff; size: 0.05; velocity: 1; particleCount: 50;"></a-entity>
      </a-box>
    </a-marker>

    <!-- Tarjeta B: marcador Kanji → Esfera -->
    <a-marker preset="kanji" id="marcadorB">
      <a-sphere color="red" radius="0.5" position="0 0.5 0" scale="1 1 1" class="figura3d" id="objetoB"
                material="opacity: 1; transparent: true; wireframe: false; emissive: #000000;">
        <!-- Partículas alrededor de la esfera (ocultas al inicio) -->
        <a-entity id="particulasB" visible="false" particle-system="preset: dust; color: #ff00ff; size: 0.05; velocity: 1; particleCount: 50;"></a-entity>
      </a-sphere>
    </a-marker>

    <!-- Cámara -->
    <a-entity camera="fov: 100;"></a-entity>

  </a-scene>

  <!-- INTERFAZ -->
  <div id="ui">
    <p><strong>Tu Nombre Aquí</strong></p>
    <p id="estado-tamano">Tamaño: Normal</p>
    <div class="botones-container">
      <button id="btn-tamano">Cambiar tamaño</button>
      <button id="btn-holograma">Activar Holograma</button>
    </div>
  </div>

  <!-- LÓGICA -->
  <script>
    // --- Lógica del botón de tamaño (Mantenido de tu código original) ---
    let ampliado = false;
    const botonTamano = document.querySelector('#btn-tamano');
    const etiquetaTamano = document.querySelector('#estado-tamano');
    const figuras = document.querySelectorAll('.figura3d');

    botonTamano.addEventListener('click', () => {
      ampliado = !ampliado;
      const nuevaEscala = ampliado ? '1.5 1.5 1.5' : '1 1 1';
      const nuevoTexto = ampliado ? 'Tamaño: Ampliado' : 'Tamaño: Normal';

      figuras.forEach(figura => {
        figura.setAttribute('scale', nuevaEscala);
      });
      etiquetaTamano.textContent = nuevoTexto;
    });

    // --- Lógica del botón de Holograma (Nuevo Efecto) ---
    let hologramaActivo = false;
    const botonHolograma = document.querySelector('#btn-holograma');
    const objetoA = document.querySelector('#objetoA');
    const objetoB = document.querySelector('#objetoB');
    const particulasA = document.querySelector('#particulasA');
    const particulasB = document.querySelector('#particulasB');

    botonHolograma.addEventListener('click', () => {
      hologramaActivo = !hologramaActivo;

      if (hologramaActivo) {
        // Activar efecto Holograma: Hacerlos semitransparentes, con brillo neón y mostrar partículas
        objetoA.setAttribute('material', 'opacity: 0.6; transparent: true; wireframe: true; emissive: #0000ff; emissiveIntensity: 2;');
        objetoB.setAttribute('material', 'opacity: 0.6; transparent: true; wireframe: true; emissive: #ff0000; emissiveIntensity: 2;');
        
        particulasA.setAttribute('visible', 'true');
        particulasB.setAttribute('visible', 'true');
        
        botonHolograma.textContent = 'Desactivar Holograma';
        botonHolograma.style.background = '#dc3545'; // Cambia a rojo
      } else {
        // Desactivar efecto Holograma: Volver a la normalidad
        objetoA.setAttribute('material', 'opacity: 1; transparent: true; wireframe: false; emissive: #000000;');
        objetoB.setAttribute('material', 'opacity: 1; transparent: true; wireframe: false; emissive: #000000;');
        
        particulasA.setAttribute('visible', 'false');
        particulasB.setAttribute('visible', 'false');
        
        botonHolograma.textContent = 'Activar Holograma';
        botonHolograma.style.background = '#8a2be2'; // Vuelve a morado
      }
    });
  </script>

</body>
</html>
