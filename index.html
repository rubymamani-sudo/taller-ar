<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>Taller AR - Tarjetas Geométricas</title>
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    
    /* Pantalla de Inicio */
    #inicio {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f0f1a; color: white; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 1000; text-align: center;
    }
    #inicio h1 { color: #00ffff; margin-bottom: 5px; z-index: 10; text-shadow: 2px 2px 4px black; }
    #inicio p { color: #cccccc; margin-bottom: 20px; z-index: 10; text-shadow: 1px 1px 2px black; }
    #btn-entrar {
      padding: 15px 30px; font-size: 18px; background: #007bff; color: white;
      border: none; border-radius: 8px; cursor: pointer; font-weight: bold; z-index: 10;
    }

    /* Escena 3D de fondo */
    #escena-fondo {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
    }

    /* Interfaz de la Cámara */
    #ui {
      position: fixed; bottom: 20px; width: 100%; text-align: center;
      z-index: 999; color: white; text-shadow: 1px 1px 3px black; display: none;
    }
    #ui p { margin: 4px 0; font-size: 16px; }
    #btn-tamano {
      padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px;
      background: #007bff; color: white; cursor: pointer;
    }
    
    /* Botón de Volver (Retorno) */
    #btn-volver {
      position: fixed; top: 15px; right: 15px; padding: 10px 15px;
      background: rgba(220, 53, 69, 0.9); color: white; border: none;
      border-radius: 8px; font-weight: bold; z-index: 1000; display: none; cursor: pointer;
    }
    
    #escena-ar { display: none; }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO CON CUBOS DE COLORES -->
  <div id="inicio">
    
    <!-- Escena 3D de fondo -->
    <a-scene id="escena-fondo" embedded vr-mode-ui="enabled: false;" renderer="antialias: true; alpha: true;">
      
      <!-- Iluminación -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 2 3"></a-entity>
      
      <!-- Matriz de cubos distribuidos (Izquierda, Centro, Derecha, Arriba, Abajo) -->
      <!-- Arriba Izquierda -->
      <a-box color="#ff0055" position="-2 2 -4" scale="0.5 0.5 0.5" animation="property: rotation; to: 360 360 0; loop: true; dur: 3000; easing: linear;"></a-box>
      <!-- Arriba Derecha -->
      <a-box color="#00ffcc" position="2 2 -4" scale="0.6 0.6 0.6" animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear;"></a-box>
      <!-- Centro Izquierda -->
      <a-box color="#ffcc00" position="-2 -1 -3" scale="0.4 0.4 0.4" animation="property: rotation; to: 360 0 360; loop: true; dur: 2500; easing: linear;"></a-box>
      <!-- Centro Derecha -->
      <a-box color="#cc00ff" position="2 -1 -3" scale="0.7 0.7 0.7" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;"></a-box>
      <!-- Abajo Centro -->
      <a-box color="#00ff55" position="0 -2 -2" scale="0.5 0.5 0.5" animation="property: rotation; to: 360 360 0; loop: true; dur: 3500; easing: linear;"></a-box>
      <!-- Fondo Centro (detrás del texto) -->
      <a-box color="#0055ff" position="0 0 -8" scale="1.2 1.2 1.2" animation="property: rotation; to: 360 0 0; loop: true; dur: 10000; easing: linear;"></a-box>

      <!-- Cámara estática para ver los cubos -->
      <a-entity camera position="0 0 0"></a-entity>
    </a-scene>

    <!-- Textos y botón encima de las figuras -->
    <h1>Realidad Aumentada</h1>
    <p>Taller de Tarjetas Geométricas</p>
    <button id="btn-entrar">Comenzar Experiencia</button>
  </div>

  <!-- BOTÓN DE VOLVER -->
  <button id="btn-volver">⬅ Volver al Inicio</button>

  <!-- ESCENA DE REALIDAD AUMENTADA (CÁMARA) -->
  <a-scene id="escena-ar" embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false;">
    <a-marker preset="hiro" id="marcadorA">
      <a-box color="blue" position="0 0.5 0" scale="1 1 1" class="figura3d"></a-box>
    </a-marker>
    <a-marker preset="kanji" id="marcadorB">
      <a-sphere color="red" radius="0.5" position="0 0.5 0" scale="1 1 1" class="figura3d"></a-sphere>
    </a-marker>
    <a-entity camera="fov: 100;"></a-entity>
  </a-scene>

  <!-- INTERFAZ DE LA CÁMARA -->
  <div id="ui">
    <p><strong>Tu Nombre Aquí</strong></p>
    <p id="estado-tamano">Normal</p>
    <button id="btn-tamano">Cambiar tamaño</button>
  </div>

  <!-- LÓGICA -->
  <script>
    // Elementos
    const inicio = document.querySelector('#inicio');
    const escenaAR = document.querySelector('#escena-ar');
    const ui = document.querySelector('#ui');
    const btnVolver = document.querySelector('#btn-volver');

    // 1. Botón de Ingresar
    document.querySelector('#btn-entrar').addEventListener('click', () => {
      inicio.style.display = 'none';
      escenaAR.style.display = 'block';
      ui.style.display = 'block';
      btnVolver.style.display = 'block'; // Mostrar botón de volver
      setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
    });

    // 2. Botón de Volver
    btnVolver.addEventListener('click', () => {
      inicio.style.display = 'flex';
      escenaAR.style.display = 'none';
      ui.style.display = 'none';
      btnVolver.style.display = 'none'; // Ocultar botón de volver
    });

    // 3. Botón de Tamaño
    let ampliado = false;
    const boton = document.querySelector('#btn-tamano');
    const etiqueta = document.querySelector('#estado-tamano');
    const figuras = document.querySelectorAll('.figura3d');

    boton.addEventListener('click', () => {
      ampliado = !ampliado;
      const nuevaEscala = ampliado ? '1.5 1.5 1.5' : '1 1 1';
      figuras.forEach(figura => figura.setAttribute('scale', nuevaEscala));
      etiqueta.textContent = ampliado ? 'Ampliado' : 'Normal';
    });
  </script>

</body>
</html>
