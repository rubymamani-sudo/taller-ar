<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Taller AR - Tarjetas Geométricas</title>
  
  <!-- Librerías: A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    
    /* Panel de interfaz mejorado */
    #ui {
      position: fixed;
      bottom: 30px;
      width: 90%;
      left: 5%;
      text-align: center;
      z-index: 999;
      color: white;
      text-shadow: 1px 1px 3px black;
      background: rgba(0, 0, 0, 0.5); /* Fondo oscuro semitransparente */
      padding: 15px;
      border-radius: 15px;
      box-sizing: border-box;
    }
    
    #ui p { margin: 5px 0; font-size: 18px; }
    
    .botones-container {
      display: flex;
      flex-direction: column; /* Apila los botones verticalmente */
      gap: 10px;
      margin-top: 15px;
    }
    
    button {
      width: 100%; /* Ocupa todo el ancho disponible */
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    /* Colores de los botones */
    #btn-tamano { background: #007bff; color: white; }
    #btn-magia { background: #6f42c1; color: white; }
  </style>
</head>
<body>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false;">

    <!-- TARJETA A: HIRO -> CUBO AZUL -->
    <a-marker preset="hiro" id="marcadorA">
      <a-box color="blue" position="0 0.5 0" scale="1 1 1" class="figura3d" id="miCubo">
        <a-animation attribute="scale" to="1.2 1.2 1.2" direction="alternate" dur="500" repeat="indefinite" begin="iniciarMagia"></a-animation>
        <a-entity id="particulasCubo" visible="false">
          <a-sphere color="cyan" radius="0.05" position="0.8 0 0">
            <a-animation attribute="position" from="0.8 0 0" to="0 -0.8 0.8" dur="2000" repeat="indefinite"></a-animation>
          </a-sphere>
          <a-sphere color="yellow" radius="0.05" position="-0.8 0 0">
            <a-animation attribute="position" from="-0.8 0 0" to="0 0.8 -0.8" dur="1800" repeat="indefinite"></a-animation>
          </a-sphere>
        </a-entity>
      </a-box>
    </a-marker>

    <!-- TARJETA B: KANJI -> ESFERA ROJA -->
    <a-marker preset="kanji" id="marcadorB">
      <a-sphere color="red" radius="0.5" position="0 0.5 0" scale="1 1 1" class="figura3d" id="miEsfera">
        <a-animation attribute="scale" to="1.2 1.2 1.2" direction="alternate" dur="500" repeat="indefinite" begin="iniciarMagia"></a-animation>
        <a-entity id="particulasEsfera" visible="false">
          <a-sphere color="magenta" radius="0.05" position="0 0.8 0">
            <a-animation attribute="position" from="0 0.8 0" to="0.8 0 0.8" dur="2200" repeat="indefinite"></a-animation>
          </a-sphere>
          <a-sphere color="white" radius="0.05" position="0 -0.8 0">
            <a-animation attribute="position" from="0 -0.8 0" to="-0.8 0 -0.8" dur="1700" repeat="indefinite"></a-animation>
          </a-sphere>
        </a-entity>
      </a-sphere>
    </a-marker>

    <a-entity camera="fov: 100;"></a-entity>
  </a-scene>

  <!-- INTERFAZ MEJORADA -->
  <div id="ui">
    <p><strong>Tu Nombre Aquí</strong></p>
    <p id="estado-tamano">Normal</p>
    <div class="botones-container">
      <button id="btn-tamano">Cambiar tamaño</button>
      <button id="btn-magia">✨ Activar Magia ✨</button>
    </div>
  </div>

  <!-- LÓGICA -->
  <script>
    let ampliado = false;
    const botonTamano = document.querySelector('#btn-tamano');
    const etiqueta = document.querySelector('#estado-tamano');
    const figuras = document.querySelectorAll('.figura3d');

    botonTamano.addEventListener('click', () => {
      ampliado = !ampliado;
      const nuevaEscala = ampliado ? '1.5 1.5 1.5' : '1 1 1';
      const nuevoTexto = ampliado ? 'Ampliado' : 'Normal';

      figuras.forEach(figura => {
        figura.setAttribute('scale', nuevaEscala);
      });

      etiqueta.textContent = nuevoTexto;
    });

    let magiaActivada = false;
    const botonMagia = document.querySelector('#btn-magia');
    const miCubo = document.querySelector('#miCubo');
    const miEsfera = document.querySelector('#miEsfera');
    const particulasCubo = document.querySelector('#particulasCubo');
    const particulasEsfera = document.querySelector('#particulasEsfera');

    botonMagia.addEventListener('click', () => {
      magiaActivada = !magiaActivada;

      if (magiaActivada) {
        miCubo.emit('iniciarMagia');
        miEsfera.emit('iniciarMagia');
        particulasCubo.setAttribute('visible', 'true');
        particulasEsfera.setAttribute('visible', 'true');
        botonMagia.textContent = 'Detener Magia';
        botonMagia.style.background = '#dc3545';
      } else {
        miCubo.setAttribute('scale', ampliado ? '1.5 1.5 1.5' : '1 1 1');
        miEsfera.setAttribute('scale', ampliado ? '1.5 1.5 1.5' : '1 1 1');
        particulasCubo.setAttribute('visible', 'false');
        particulasEsfera.setAttribute('visible', 'false');
        miCubo.setAttribute('animation__pulso', '');
        miEsfera.setAttribute('animation__pulso', '');
        botonMagia.textContent = '✨ Activar Magia ✨';
        botonMagia.style.background = '#6f42c1';
      }
    });
  </script>

</body>
</html>
