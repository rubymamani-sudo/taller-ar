<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Taller AR - Tarjetas Geométricas</title>
  <!-- Librerías: A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 999;
      color: white;
      text-shadow: 1px 1px 3px black;
    }
    #ui p { margin: 4px 0; font-size: 16px; }
    #btn-tamano {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false;">

    <!-- Tarjeta A: marcador Hiro → Cubo azul -->
    <a-marker preset="hiro" id="marcadorA">
      <a-box color="blue" position="0 0.5 0" scale="1 1 1" class="figura3d"></a-box>
    </a-marker>

    <!-- Tarjeta B: marcador Kanji → Esfera roja -->
    <a-marker preset="kanji" id="marcadorB">
      <a-sphere color="red" radius="0.5" position="0 0.5 0" scale="1 1 1" class="figura3d"></a-sphere>
    </a-marker>

    <!-- Cámara necesaria para A-Frame -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- INTERFAZ: nombre, estado y botón -->
  <div id="ui">
    <p><strong>Tu Nombre Aquí</strong></p>
    <p id="estado-tamano">Normal</p>
    <button id="btn-tamano">Cambiar tamaño</button>
  </div>

  <!-- LÓGICA DEL BOTÓN -->
  <script>
    let ampliado = false;
    const boton = document.querySelector('#btn-tamano');
    const etiqueta = document.querySelector('#estado-tamano');
    const figuras = document.querySelectorAll('.figura3d');

    boton.addEventListener('click', () => {
      ampliado = !ampliado;
      const nuevaEscala = ampliado ? '1.5 1.5 1.5' : '1 1 1';
      const nuevoTexto = ampliado ? 'Ampliado' : 'Normal';

      figuras.forEach(figura => {
        figura.setAttribute('scale', nuevaEscala);
      });

      etiqueta.textContent = nuevoTexto;
    });
  </script>

</body>
</html>
