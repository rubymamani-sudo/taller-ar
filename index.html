<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Taller AR - Tarjetas Geométricas</title>
  <!-- Librerías: A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 9999;
      color: white;
      text-shadow: 1px 1px 3px black;
      pointer-events: none;
    }
    #ui p { margin: 4px 0; font-size: 16px; }
    #btn-tamano {
      pointer-events: auto;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ESCENA DE REALIDAD AUMENTADA CON MAYOR RESOLUCIÓN Y TRACKING AFINADO -->
  <a-scene 
    embedded 
    vr-mode-ui="enabled: false;"
    renderer="antialias: true; alpha: true; precision: mediump;"
    arjs="sourceType: webcam; 
          sourceWidth: 1280; sourceHeight: 960; 
          displayWidth: 1280; displayHeight: 960; 
          detectionMode: mono; 
          maxDetectionRate: 60; 
          patternRatio: 0.50; 
          debugUIEnabled: false;">

    <!-- Tarjeta A: marcador Hiro → Cubo azul -->
    <a-marker preset="hiro" id="marcadorA"
              smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"
              emitevents="true">
      <a-box color="blue" position="0 0.5 0" scale="1 1 1" class="figura3d"></a-box>
    </a-marker>

    <!-- Tarjeta B: marcador Kanji → Esfera roja -->
    <a-marker preset="kanji" id="marcadorB"
              smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"
              emitevents="true">
      <a-sphere color="red" radius="0.5" position="0 0.5 0" scale="1 1 1" class="figura3d"></a-sphere>
    </a-marker>

    <!-- Tarjeta C: marcador Koi → Pirámide rosada -->
    <a-marker type="pattern" url="pattern-koi.patt" id="marcadorC"
              smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"
              emitevents="true">
      <a-cone color="hotpink" segments-radial="4" radius-bottom="0.5" radius-top="0" height="1" position="0 0.5 0" scale="1 1 1" class="figura3d"></a-cone>
    </a-marker>

    <!-- Cámara calibrada por defecto (sin FOV forzado a 100) -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- INTERFAZ: nombre, estado y botón -->
  <div id="ui">
    <p id="estado-tamano">Tamaño normal</p>
    <button id="btn-tamano">Cambiar tamaño</button>
  </div>

  <!-- LÓGICA DEL BOTÓN CON ANIMACIÓN SUAVE -->
  <script>
    let ampliado = false;
    const boton = document.querySelector('#btn-tamano');
    const etiqueta = document.querySelector('#estado-tamano');
    const figuras = document.querySelectorAll('.figura3d');

    boton.addEventListener('click', () => {
      ampliado = !ampliado;
      const nuevaEscala = ampliado ? '1.5 1.5 1.5' : '1 1 1';
      const nuevoTexto = ampliado ? 'Ampliado' : 'Normal';

      figuras.forEach(figura => {
        // Transición animada en lugar de salto brusco
        figura.setAttribute('animation', {
          property: 'scale',
          to: nuevaEscala,
          dur: 250,
          easing: 'easeOutQuad'
        });
      });

      etiqueta.textContent = nuevoTexto;
    });
  </script>

</body>
</html>
