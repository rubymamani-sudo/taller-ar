<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Taller AR - Tarjetas Geométricas</title>
  <!-- Librerías: A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 999;
      color: white;
      text-shadow: 1px 1px 3px black;
    }
    #ui p { margin: 4px 0; font-size: 16px; }
    .botones-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #btn-tamano { background: #007bff; color: white; }
    #btn-efecto { background: #28a745; color: white; }
  </style>
</head>
<body>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false;">

    <!-- Tarjeta A: marcador Hiro → Cubo azul con animación de rotación -->
    <a-marker preset="hiro" id="marcadorA">
      <a-box color="blue" position="0 0.5 0" scale="1 1 1" class="figura3d" id="miCubo"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear; startEvents: iniciarRotacion">
      </a-box>
    </a-marker>

    <!-- Tarjeta B: marcador Kanji → Esfera roja con animación de rotación -->
    <a-marker preset="kanji" id="marcadorB">
      <a-sphere color="red" radius="0.5" position="0 0.5 0" scale="1 1 1" class="figura3d" id="miEsfera"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear; startEvents: iniciarRotacion">
      </a-sphere>
    </a-marker>

    <!-- Cámara necesaria para A-Frame -->
    <a-entity camera="fov: 100;"></a-entity>

  </a-scene>

  <!-- INTERFAZ: nombre, estado y botones -->
  <div id="ui">
    <p><strong>Tu Nombre Aquí</strong></p>
    <p id="estado-tamano">Normal</p>
    <div class="botones-container">
      <button id="btn-tamano">Cambiar tamaño</button>
      <button id="btn-efecto">Activar Efecto</button>
    </div>
  </div>

  <!-- LÓGICA DE LOS BOTONES -->
  <script>
    // --- Lógica del botón de tamaño ---
    let ampliado = false;
    const botonTamano = document.querySelector('#btn-tamano');
    const etiqueta = document.querySelector('#estado-tamano');
    const figuras = document.querySelectorAll('.figura3d');

    botonTamano.addEventListener('click', () => {
      ampliado = !ampliado;
      const nuevaEscala = ampliado ? '1.5 1.5 1.5' : '1 1 1';
      const nuevoTexto = ampliado ? 'Ampliado' : 'Normal';

      figuras.forEach(figura => {
        figura.setAttribute('scale', nuevaEscala);
      });

      etiqueta.textContent = nuevoTexto;
    });

    // --- Lógica del botón de efecto (Rotación) ---
    let efectoActivado = false;
    const botonEfecto = document.querySelector('#btn-efecto');
    const miCubo = document.querySelector('#miCubo');
    const miEsfera = document.querySelector('#miEsfera');

    botonEfecto.addEventListener('click', () => {
      efectoActivado = !efectoActivado;
      
      if (efectoActivado) {
        // Iniciar la animación de rotación
        miCubo.emit('iniciarRotacion');
        miEsfera.emit('iniciarRotacion');
        botonEfecto.textContent = 'Detener Efecto';
        botonEfecto.style.background = '#dc3545'; // Cambia a rojo
      } else {
        // Detener la animación y devolverlos a su posición original
        miCubo.removeAttribute('animation');
        miEsfera.removeAttribute('animation');
        
        // Restaurar las animaciones para que se puedan volver a activar
        miCubo.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear; startEvents: iniciarRotacion');
        miEsfera.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear; startEvents: iniciarRotacion');
        
        // Devolverlos a la rotación 0
        miCubo.setAttribute('rotation', '0 0 0');
        miEsfera.setAttribute('rotation', '0 0 0');
        
        botonEfecto.textContent = 'Activar Efecto';
        botonEfecto.style.background = '#28a745'; // Cambia a verde
      }
    });
  </script>

</body>
</html>
